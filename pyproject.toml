[project]
name = "talkcut"
version = "0.0.1"
description = "An agent-driven lecture and podcast editing workflow — initial scaffold."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yunsung Lee" }]
dependencies = []

[project.urls]
Repository = "https://github.com/alohays/talkcut"

[project.scripts]
talkcut = "talkcut.__main__:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
