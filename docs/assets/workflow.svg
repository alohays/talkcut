<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="342" viewBox="0 0 1200 342" role="img" aria-labelledby="title desc">
<title id="title">From recordings to a first edit</title><desc id="desc">Preserve and inspect both sources, build an explicit draft, render its timeline, then evaluate and watch the output. Previous plans and successful renders remain available.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#465c6c"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="10" height="10" fill="#f9e2dc"/><path d="M0 0V10" stroke="#dfada0" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" rx="18" fill="#f7fafb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
<text x="36" y="50" font-size="29" fill="#172b3a" font-weight="700" text-anchor="start">From recordings to a first edit</text>
<text x="36" y="82" font-size="21" fill="#465c6c" font-weight="400" text-anchor="start">A local workflow with explicit timing and reversible decisions.</text>
<rect x="36" y="108" width="255" height="163" rx="10" fill="#ffffff" stroke="#cbd8df"/>
<rect x="52" y="122" width="37" height="30" rx="7" fill="#d7eee7" stroke="none"/>
<text x="70.5" y="144" font-size="19" fill="#172b3a" font-weight="700" text-anchor="middle">01</text>
<text x="52" y="181" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Preserve + inspect</text>
<text x="52" y="208" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Screen and speaker</text>
<text x="52" y="232" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Hash-verified copies</text>
<text x="52" y="256" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Complete PTS inventory</text>
<path d="M296 190L319 190" fill="none" stroke="#465c6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="327" y="108" width="255" height="163" rx="10" fill="#ffffff" stroke="#cbd8df"/>
<rect x="343" y="122" width="37" height="30" rx="7" fill="#dfeafb" stroke="none"/>
<text x="361.5" y="144" font-size="19" fill="#172b3a" font-weight="700" text-anchor="middle">02</text>
<text x="343" y="181" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Build a draft</text>
<text x="343" y="208" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Choose one audio source</text>
<text x="343" y="232" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Set constant offsets</text>
<text x="343" y="256" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Review any edge trims</text>
<path d="M587 190L610 190" fill="none" stroke="#465c6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="618" y="108" width="255" height="163" rx="10" fill="#ffffff" stroke="#cbd8df"/>
<rect x="634" y="122" width="37" height="30" rx="7" fill="#d7eee7" stroke="none"/>
<text x="652.5" y="144" font-size="19" fill="#172b3a" font-weight="700" text-anchor="middle">03</text>
<text x="634" y="181" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Render</text>
<text x="634" y="208" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Full screen canvas</text>
<text x="634" y="232" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Full-frame speaker inset</text>
<text x="634" y="256" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">One shared cut timeline</text>
<path d="M878 190L901 190" fill="none" stroke="#465c6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="909" y="108" width="255" height="163" rx="10" fill="#ffffff" stroke="#cbd8df"/>
<rect x="925" y="122" width="37" height="30" rx="7" fill="#dfeafb" stroke="none"/>
<text x="943.5" y="144" font-size="19" fill="#172b3a" font-weight="700" text-anchor="middle">04</text>
<text x="925" y="181" font-size="22" fill="#172b3a" font-weight="700" text-anchor="start">Evaluate + watch</text>
<text x="925" y="208" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Check decode and timing</text>
<text x="925" y="232" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Open the actual MP4</text>
<text x="925" y="256" font-size="18" fill="#465c6c" font-weight="400" text-anchor="start">Owner review is pending</text>
<text x="36" y="313" font-size="21" fill="#465c6c" font-weight="400" text-anchor="start">Earlier plans and successful outputs stay available when you revise the edit.</text>
</g></svg>
