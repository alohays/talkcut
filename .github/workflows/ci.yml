name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.29'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check src tests examples
      - run: uv run --locked mypy src/talkcut
      - name: Unit, contract and actual FFmpeg regression tests
        run: uv run --locked pytest -q
      - name: Execute documented recovery example
        run: uv run --locked python examples/recovery.py "$RUNNER_TEMP/talkcut-recovery"
      - run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/talkcut-install"
          uv pip install --python "$RUNNER_TEMP/talkcut-install/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/talkcut-install/bin/talkcut" --version
          "$RUNNER_TEMP/talkcut-install/bin/talkcut" doctor --json
